name: Build stable release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Main commit or ref to release
        required: true
        default: main
        type: string

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: macos-26
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      build: ${{ steps.meta.outputs.build }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve stable release identity
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Stable releases must use the workflow from main: $GITHUB_REF" >&2
            exit 1
          fi

          sha=$(git rev-parse HEAD)
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Release commit is not reachable from origin/main: $sha" >&2
            exit 1
          fi

          metadata=$(scripts/release/release-metadata.sh from-ref stable "$sha")
          IFS=$'\t' read -r channel _ version build _ tag <<<"$metadata"
          [[ "$channel" == stable ]]

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            [[ $(git cat-file -t "refs/tags/$tag") == tag ]]
            tagged_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_sha" != "$sha" ]]; then
              echo "Tag $tag points to $tagged_sha instead of $sha" >&2
              exit 1
            fi
            latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
            if [[ "$tag" != "$latest_tag" ]]; then
              echo "Only the latest stable tag can be repaired: $tag != $latest_tag" >&2
              exit 1
            fi
          else
            latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
            if [[ -n "$latest_tag" ]]; then
              scripts/release/version-greater-than.sh "${latest_tag#v}" "$version"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag exists without its required annotated tag" >&2
              exit 1
            fi
          fi

          artifact="stable-release-${version}-${sha:0:8}"
          {
            echo "artifact=$artifact"
            echo "build=$build"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Build release assets
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          scripts/release/build-release.sh "$VERSION" "$BUILD_NUMBER" release
          scripts/release/verify-release-assets.sh release "$VERSION" "$BUILD_NUMBER"

      - name: Attest release assets
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/Dictator-${{ steps.meta.outputs.version }}-universal.dmg
            release/SHA256SUMS.txt

      - name: Stage verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            release/Dictator-${{ steps.meta.outputs.version }}-universal.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: prepare
    runs-on: macos-15
    environment: stable-release
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release

      - name: Revalidate release candidate
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [[ $(git rev-parse HEAD) == "$SHA" ]]
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Release commit is no longer reachable from origin/main: $SHA" >&2
            exit 1
          fi

          metadata=$(scripts/release/release-metadata.sh from-ref stable HEAD)
          IFS=$'\t' read -r channel _ version build _ tag <<<"$metadata"
          [[ "$channel" == stable ]]
          [[ "$version" == "$VERSION" ]]
          [[ "$build" == "$BUILD_NUMBER" ]]
          [[ "$tag" == "$TAG" ]]

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ $(git cat-file -t "refs/tags/$TAG") == tag ]]
            [[ $(git rev-list -n 1 "$TAG") == "$SHA" ]]
            latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
            if [[ "$TAG" != "$latest_tag" ]]; then
              echo "Only the latest stable tag can be repaired: $TAG != $latest_tag" >&2
              exit 1
            fi
          else
            latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
            if [[ -n "$latest_tag" ]]; then
              scripts/release/version-greater-than.sh "${latest_tag#v}" "$VERSION"
            fi
          fi
          scripts/release/verify-release-assets.sh release "$VERSION" "$BUILD_NUMBER"

      - name: Ensure release tag
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/release/ensure-release-tag.sh "$TAG" "$SHA"

      - name: Create or finish GitHub Release
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          expected_assets=$(printf '%s\n%s\n' "Dictator-${VERSION}-universal.dmg" SHA256SUMS.txt | sort)

          if release_json=$(gh release view "$TAG" --json assets,isDraft,isPrerelease 2>/dev/null); then
            [[ $(jq -r .isPrerelease <<<"$release_json") == false ]]
            if [[ $(jq -r .isDraft <<<"$release_json") == false ]]; then
              actual_assets=$(jq -r '.assets[].name' <<<"$release_json" | sort)
              if [[ "$actual_assets" != "$expected_assets" ]]; then
                echo "Published release assets do not match the prepared assets" >&2
                exit 1
              fi
              existing="$RUNNER_TEMP/existing-release"
              mkdir -p "$existing"
              gh release download "$TAG" --dir "$existing"
              scripts/release/verify-release-assets.sh "$existing" "$VERSION" "$BUILD_NUMBER"
              echo "Release $TAG is already published and verified"
              exit 0
            fi
          else
            previous_tag=$(scripts/release/previous-release-tag.sh stable HEAD)
            notes_arguments=(--generate-notes)
            if [[ -n "$previous_tag" ]]; then
              notes_arguments+=(--notes-start-tag "$previous_tag")
            fi
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "$TAG" \
              "${notes_arguments[@]}"
          fi

          gh release upload "$TAG" \
            "release/Dictator-${VERSION}-universal.dmg" \
            release/SHA256SUMS.txt \
            --clobber

          release_json=$(gh release view "$TAG" --json assets,isDraft,isPrerelease)
          [[ $(jq -r .isDraft <<<"$release_json") == true ]]
          [[ $(jq -r .isPrerelease <<<"$release_json") == false ]]
          actual_assets=$(jq -r '.assets[].name' <<<"$release_json" | sort)
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets do not match the prepared assets" >&2
            exit 1
          fi

          uploaded="$RUNNER_TEMP/uploaded-release"
          mkdir -p "$uploaded"
          gh release download "$TAG" --dir "$uploaded"
          scripts/release/verify-release-assets.sh "$uploaded" "$VERSION" "$BUILD_NUMBER"
          gh release edit "$TAG" --draft=false --latest

  publish:
    needs: finalize
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: ./.github/workflows/release-published.yml
    with:
      tag: ${{ needs.finalize.outputs.tag }}
    secrets: inherit
